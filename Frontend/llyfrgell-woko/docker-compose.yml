services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: llyfrgell_dev
      POSTGRES_USER: llyfrgell_dev
      POSTGRES_PASSWORD: llyfrgell_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llyfrgell_dev -d llyfrgell_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: